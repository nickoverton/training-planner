<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F4F1EC;
    --bg-card: #FDFAF6;
    --sidebar-bg: #1A1714;
    --sidebar-hover: #2A2420;
    --sidebar-active: #332E2A;
    --sidebar-border: #2E2926;
    --sidebar-text: #C8C2BC;
    --sidebar-text-2: #7A7470;
    --border: #DDD9D0;
    --border-strong: #C5BFB4;
    --text: #1A1714;
    --text-2: #5A5650;
    --text-3: #9B9590;

    --bike-bg: #E0ECF8;   --bike-text: #1A3D6B;   --bike-accent: #4A90D9;
    --run-bg: #D9F0E8;    --run-text: #0D4435;    --run-accent: #2DB87E;
    --swim-bg: #E6E3FA;   --swim-text: #2D1F7A;   --swim-accent: #7B6EE8;
    --gym-bg: #FCE4F0;    --gym-text: #7A1547;    --gym-accent: #D63384;

    --key-bg: #FAEAE3;    --key-text: #7A2D12;
    --build-bg: #FEF3E0;  --build-text: #6B3C06;
    --down-bg: #E1EFE8;   --down-text: #1B5E3A;

    --drag-shadow: 0 8px 32px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.1);
    --over-ring: 2px dashed var(--swim-accent);
    --sidebar-w: 220px;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  /* ════════════════════════════════════════
     SIDEBAR
  ════════════════════════════════════════ */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--sidebar-bg); display: flex; flex-direction: column;
    height: 100vh; position: sticky; top: 0; overflow: hidden;
    transition: width 0.2s, min-width 0.2s;
  }
  .sidebar.collapsed { width: 48px; min-width: 48px; }

  .sidebar-top {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--sidebar-border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .sidebar-logo {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; color: var(--sidebar-text); white-space: nowrap; overflow: hidden;
    transition: opacity 0.15s;
  }
  .sidebar.collapsed .sidebar-logo { opacity: 0; pointer-events: none; }
  .sidebar-toggle {
    background: none; border: none; cursor: pointer; color: var(--sidebar-text-2);
    padding: 4px; border-radius: 4px; flex-shrink: 0; transition: color 0.15s, background 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-toggle:hover { color: var(--sidebar-text); background: var(--sidebar-hover); }

  .sidebar-new {
    margin: 10px 10px 6px;
    display: flex; align-items: center; gap: 7px;
    background: none; border: 1px dashed var(--sidebar-border); border-radius: 6px;
    padding: 8px 10px; color: var(--sidebar-text-2); font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    overflow: hidden; width: calc(100% - 20px);
  }
  .sidebar-new:hover { color: var(--sidebar-text); border-color: #4A4540; background: var(--sidebar-hover); }
  .sidebar.collapsed .sidebar-new { padding: 8px; justify-content: center; border-radius: 6px; width: calc(100% - 16px); margin: 10px 8px 6px; }
  .sidebar.collapsed .sidebar-new span { display: none; }

  .sidebar-section-label {
    font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
    letter-spacing: 0.12em; color: var(--sidebar-text-2); padding: 8px 14px 4px;
    transition: opacity 0.15s;
  }
  .sidebar.collapsed .sidebar-section-label { opacity: 0; }

  .sidebar-files { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 8px 12px; }
  .sidebar-files::-webkit-scrollbar { width: 4px; }
  .sidebar-files::-webkit-scrollbar-track { background: transparent; }
  .sidebar-files::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 2px; }

  .file-item {
    display: flex; align-items: center; gap: 0; border-radius: 6px;
    cursor: pointer; transition: background 0.12s; margin-bottom: 2px;
    overflow: hidden; position: relative;
  }
  .file-item:hover { background: var(--sidebar-hover); }
  .file-item.active { background: var(--sidebar-active); }

  .file-item-icon {
    width: 32px; min-width: 32px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    color: var(--sidebar-text-2); flex-shrink: 0; font-size: 13px;
  }
  .file-item.active .file-item-icon { color: var(--sidebar-text); }

  .file-item-body {
    flex: 1; min-width: 0; padding: 6px 4px 6px 0;
    overflow: hidden; transition: opacity 0.15s;
  }
  .sidebar.collapsed .file-item-body { opacity: 0; pointer-events: none; }

  .file-item-name {
    font-size: 12px; font-weight: 500; color: var(--sidebar-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
  }
  .file-item-meta {
    font-size: 10px; color: var(--sidebar-text-2); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
  }
  .file-item.active .file-item-name { color: #FDFAF6; }

  .file-actions {
    display: none; gap: 2px; padding-right: 6px; flex-shrink: 0;
  }
  .file-item:hover .file-actions,
  .file-item.active .file-actions { display: flex; }
  .sidebar.collapsed .file-actions { display: none !important; }

  .file-action-btn {
    background: none; border: none; color: var(--sidebar-text-2); cursor: pointer;
    padding: 3px 4px; border-radius: 3px; font-size: 11px; line-height: 1;
    transition: color 0.12s, background 0.12s;
  }
  .file-action-btn:hover { color: var(--sidebar-text); background: rgba(255,255,255,0.08); }
  .file-action-btn.del:hover { color: #E87070; }

  /* Inline rename input */
  .file-rename-input {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    background: rgba(255,255,255,0.08); border: 1px solid #4A4540; border-radius: 3px;
    color: #FDFAF6; outline: none; padding: 1px 5px; width: 100%;
  }

  .sidebar-bottom {
    border-top: 1px solid var(--sidebar-border); padding: 10px 8px;
  }
  .sidebar-bottom-btn {
    display: flex; align-items: center; gap: 7px; width: 100%;
    background: none; border: none; color: var(--sidebar-text-2); font-family: 'DM Sans', sans-serif;
    font-size: 11px; cursor: pointer; padding: 6px 6px; border-radius: 5px; transition: all 0.12s;
    white-space: nowrap; overflow: hidden;
  }
  .sidebar-bottom-btn:hover { color: var(--sidebar-text); background: var(--sidebar-hover); }
  .sidebar.collapsed .sidebar-bottom-btn span { display: none; }

  /* ════════════════════════════════════════
     MAIN AREA
  ════════════════════════════════════════ */
  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; height: 100vh; }

  /* ── App Header ── */
  .app-header {
    background: var(--bg-card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; gap: 16px; flex-shrink: 0;
  }
  .header-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .editable-title {
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 0.1em; color: var(--text); background: transparent;
    border: none; outline: none; width: 100%; min-width: 120px; padding: 0;
  }
  .editable-title::placeholder { color: var(--text-3); }
  .editable-subtitle {
    font-size: 12px; color: var(--text-3); background: transparent; border: none;
    outline: none; width: 100%; font-weight: 300; padding: 0; font-family: 'DM Sans', sans-serif;
  }
  .editable-subtitle::placeholder { color: var(--text-3); opacity: 0.7; }
  .editable-title:hover, .editable-subtitle:hover,
  .editable-title:focus, .editable-subtitle:focus {
    background: rgba(0,0,0,0.03); border-radius: 3px; padding: 1px 4px; margin-left: -4px;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border-strong);
    background: var(--bg-card); color: var(--text-2); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--text); color: var(--bg-card); border-color: var(--text); }
  .btn-primary:hover { background: #333; }
  .btn-danger { color: #9B3A2A; border-color: #E8C5BC; }
  .btn-danger:hover { background: var(--key-bg); color: var(--key-text); }
  .save-indicator { font-size: 11px; color: var(--text-3); font-style: italic; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
  .save-indicator.visible { opacity: 1; }

  /* ── Legend ── */
  .legend-bar {
    padding: 9px 24px; background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; flex-shrink: 0;
  }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; }
  .leg-hint { margin-left: auto; font-size: 11px; color: var(--text-3); font-style: italic; }

  /* ── Plan content ── */
  .plan-content { padding: 24px; flex: 1; }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 60vh; gap: 14px; color: var(--text-3); text-align: center;
  }
  .empty-state-icon { font-size: 40px; opacity: 0.4; }
  .empty-state h2 { font-size: 16px; font-weight: 500; color: var(--text-2); }
  .empty-state p { font-size: 13px; max-width: 280px; line-height: 1.6; }

  /* ── Week block ── */
  .week-block { margin-bottom: 28px; }
  .week-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); gap: 12px;
  }
  .week-header-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .week-num { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 1px; }
  .week-edit-title {
    font-size: 16px; font-weight: 500; color: var(--text);
    background: transparent; border: none; outline: none; width: 100%; font-family: 'DM Sans', sans-serif; padding: 0;
  }
  .week-edit-title::placeholder { color: var(--text-3); font-weight: 400; }
  .week-edit-desc {
    font-size: 12px; color: var(--text-3);
    background: transparent; border: none; outline: none; width: 100%; font-family: 'DM Sans', sans-serif; padding: 0;
  }
  .week-edit-desc::placeholder { color: var(--text-3); opacity: 0.6; font-style: italic; }
  .week-edit-title:hover,.week-edit-desc:hover,.week-edit-title:focus,.week-edit-desc:focus {
    background: rgba(0,0,0,0.03); border-radius: 3px; padding: 1px 4px; margin-left: -4px;
  }
  .week-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; position: relative; }

  /* ── Badge ── */
  .badge-btn {
    font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
    letter-spacing: 0.06em; padding: 3px 9px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; transition: filter 0.15s; white-space: nowrap;
  }
  .badge-btn.b-build { background: var(--build-bg); color: var(--build-text); }
  .badge-btn.b-key   { background: var(--key-bg);   color: var(--key-text);   }
  .badge-btn.b-down  { background: var(--down-bg);  color: var(--down-text);  }
  .badge-btn:hover { filter: brightness(0.94); }

  .badge-menu {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.13); z-index: 300; min-width: 200px;
    opacity: 0; pointer-events: none; transform: translateY(-6px) scale(0.98);
    transition: opacity 0.15s, transform 0.15s; overflow: hidden;
  }
  .badge-menu.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
  .badge-menu-section { padding: 8px 0 4px; }
  .badge-menu-heading { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-3); padding: 0 12px 6px; }
  .badge-menu-item { display: flex; align-items: center; gap: 9px; padding: 7px 12px; cursor: pointer; transition: background 0.1s; font-size: 12px; color: var(--text-2); font-family: 'DM Sans', sans-serif; }
  .badge-menu-item:hover { background: var(--bg); }
  .badge-menu-item.active-badge { color: var(--text); font-weight: 500; }
  .badge-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .badge-checkmark { margin-left: auto; font-size: 11px; opacity: 0; }
  .active-badge .badge-checkmark { opacity: 1; }
  .badge-menu-sep { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .rename-section { padding: 4px 0 8px; }
  .rename-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px; }
  .rename-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .rename-input { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.12s; }
  .rename-input:focus { border-color: var(--swim-accent); background: var(--bg-card); }

  /* ── Grid ── */
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day-col { display: flex; flex-direction: column; }
  .day-header { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-3); text-align: center; padding: 5px 0 7px; }
  .drop-zone {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px; min-height: 110px; flex: 1; display: flex; flex-direction: column;
    gap: 5px; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; position: relative;
  }
  .drop-zone.drag-over { background: #F0EDE8; border: var(--over-ring); box-shadow: 0 0 0 3px rgba(123,110,232,0.1); }
  .drop-zone.drag-over::before { content: 'Drop here'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--swim-accent); pointer-events: none; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; }

  /* ── Session ── */
  .session { border-radius: 5px; padding: 6px 8px; cursor: grab; transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s; user-select: none; touch-action: none; }
  .session:active { cursor: grabbing; }
  .session.dragging { opacity: 0.3; }
  .session.floating { position: fixed; pointer-events: none; z-index: 9999; box-shadow: var(--drag-shadow); transform: rotate(1.5deg) scale(1.04); opacity: 0.95; transition: none; }
  .session:hover:not(.dragging) { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
  .s-bike { background: var(--bike-bg); } .s-run { background: var(--run-bg); }
  .s-swim { background: var(--swim-bg); } .s-gym { background: var(--gym-bg); }
  .s-name { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .s-bike .s-name { color: var(--bike-text); } .s-run .s-name { color: var(--run-text); }
  .s-swim .s-name { color: var(--swim-text); } .s-gym .s-name { color: var(--gym-text); }
  .s-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .s-bike .s-dot { background: var(--bike-accent); } .s-run .s-dot { background: var(--run-accent); }
  .s-swim .s-dot { background: var(--swim-accent); } .s-gym .s-dot { background: var(--gym-accent); }
  .s-detail { font-size: 10px; color: var(--text-2); margin-top: 2px; line-height: 1.45; }
  .session-actions { display: flex; gap: 4px; margin-top: 5px; opacity: 0; transition: opacity 0.12s; }
  .session:hover .session-actions { opacity: 1; }
  .s-action { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; padding: 2px 6px; border-radius: 3px; border: 1px solid transparent; cursor: pointer; transition: all 0.12s; background: rgba(255,255,255,0.6); color: var(--text-2); }
  .s-action:hover { background: rgba(255,255,255,0.95); color: var(--text); }
  .s-action.del { color: #9B3A2A; }
  .s-action.del:hover { background: #FAEAE3; color: #7A2D12; }

  /* ── Add session btn ── */
  .add-session-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; margin-top: auto; padding: 5px 0; border: 1px dashed var(--border-strong); border-radius: 5px; background: transparent; color: var(--text-3); font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.15s; opacity: 0; }
  .drop-zone:hover .add-session-btn { opacity: 1; }
  .add-session-btn:hover { background: var(--bg); color: var(--text-2); border-color: var(--text-3); }

  /* ── Week totals ── */
  .week-totals { display: flex; gap: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .wtot { font-size: 11px; color: var(--text-3); }
  .wtot strong { color: var(--text); font-weight: 500; margin-left: 2px; }

  /* ── Week controls ── */
  .week-controls { display: flex; align-items: center; gap: 8px; padding: 12px 0 4px; }
  .week-ctrl-btn { display: flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 6px; border: 1px dashed var(--border-strong); background: transparent; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
  .week-ctrl-btn:hover { background: var(--bg-card); border-style: solid; color: var(--text); }
  .week-ctrl-btn.remove { color: #9B3A2A; border-color: #E8C5BC; }
  .week-ctrl-btn.remove:hover { background: var(--key-bg); border-style: solid; }
  .week-count-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-3); margin-left: 4px; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0 28px; }

  /* ── Session modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,23,20,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(2px); }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 360px; max-width: 92vw; box-shadow: 0 20px 60px rgba(0,0,0,0.2); transform: translateY(10px) scale(0.98); transition: transform 0.2s cubic-bezier(0.34,1.3,0.64,1); }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  .modal-title { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 16px; }
  .modal-title strong { display: block; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: 0; margin-top: 2px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 11px; font-weight: 500; color: var(--text-2); display: block; margin-bottom: 5px; }
  .form-input { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .form-input:focus { border-color: var(--swim-accent); box-shadow: 0 0 0 3px rgba(123,110,232,0.12); }
  .type-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .type-pill { flex: 1; min-width: 60px; padding: 7px 4px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.15s; color: var(--text-2); }
  .type-pill[data-type="bike"].active { background: var(--bike-bg); border-color: var(--bike-accent); color: var(--bike-text); }
  .type-pill[data-type="run"].active  { background: var(--run-bg);  border-color: var(--run-accent);  color: var(--run-text);  }
  .type-pill[data-type="swim"].active { background: var(--swim-bg); border-color: var(--swim-accent); color: var(--swim-text); }
  .type-pill[data-type="gym"].active  { background: var(--gym-bg);  border-color: var(--gym-accent);  color: var(--gym-text);  }
  .modal-footer { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg-card); font-size: 12px; padding: 9px 18px; border-radius: 20px; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1); z-index: 9998; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    :root { --sidebar-w: 180px; }
    .week-grid { grid-template-columns: repeat(4, 1fr); }
    .plan-content { padding: 16px; }
    .app-header { padding: 12px 16px; }
    .legend-bar { padding: 8px 16px; }
  }
  @media (max-width: 640px) {
    .sidebar { position: fixed; left: 0; top: 0; z-index: 200; height: 100vh; }
    .sidebar:not(.collapsed) { box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
    .week-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="sidebar-logo">PLANS</span>
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="2" width="12" height="1.5" rx="0.75" fill="currentColor"/>
        <rect x="1" y="6.25" width="12" height="1.5" rx="0.75" fill="currentColor"/>
        <rect x="1" y="10.5" width="12" height="1.5" rx="0.75" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <button class="sidebar-new" onclick="newFile()">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>New plan</span>
  </button>

  <div class="sidebar-section-label">SAVED PLANS</div>
  <div class="sidebar-files" id="sidebar-files"></div>

  <div class="sidebar-bottom">
    <button class="sidebar-bottom-btn" onclick="sharePlan()" title="Share plan as .json file">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="9.5" cy="2.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="9.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="2.5" cy="6" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 6l4-3.2M4 6l4 3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Share plan</span>
    </button>
    <button class="sidebar-bottom-btn" onclick="triggerImport()" title="Import a shared .json plan">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 8V1M3 5l3-3 3 3M1 10h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Import plan</span>
    </button>
    <button class="sidebar-bottom-btn" onclick="exportPlan()" title="Export as text">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 5l3 3 3-3M1 10h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Export as text</span>
    </button>
  </div>
</aside>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

<!-- ═══════════ MAIN ═══════════ -->
<div class="main-area">
  <header class="app-header">
    <div class="header-left">
      <input class="editable-title" id="plan-title" type="text" placeholder="Plan name…" spellcheck="false">
      <input class="editable-subtitle" id="plan-athlete" type="text" placeholder="Athlete name">
    </div>
    <div class="header-actions">
      <span class="save-indicator" id="save-indicator">Saved</span>
      <button class="btn btn-danger" onclick="clearPlan()">Clear</button>
      <button class="btn" onclick="resetSessions()">Reset sessions</button>
    </div>
  </header>

  <div class="legend-bar">
    <div class="leg"><div class="leg-dot" style="background:var(--bike-accent)"></div>Bike</div>
    <div class="leg"><div class="leg-dot" style="background:var(--run-accent)"></div>Run</div>
    <div class="leg"><div class="leg-dot" style="background:var(--swim-accent)"></div>Swim</div>
    <div class="leg"><div class="leg-dot" style="background:var(--gym-accent)"></div>Gym</div>
    <div class="leg-hint">Autosaved · drag to move · hover to edit/delete · click badge to rename</div>
  </div>

  <div class="plan-content" id="app"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Session modal -->
<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title"><span id="modal-context"></span><strong id="modal-heading"></strong></div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <div class="type-pills">
        <button class="type-pill" data-type="bike" onclick="selectType('bike')">🚲 Bike</button>
        <button class="type-pill" data-type="run"  onclick="selectType('run')">🏃 Run</button>
        <button class="type-pill" data-type="swim" onclick="selectType('swim')">🏊 Swim</button>
        <button class="type-pill" data-type="gym"  onclick="selectType('gym')">🏋️ Gym</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="modal-name">Session name</label>
      <input class="form-input" id="modal-name" type="text" placeholder="e.g. Long ride, Tempo intervals…">
    </div>
    <div class="form-group">
      <label class="form-label" for="modal-detail">Detail / notes</label>
      <input class="form-input" id="modal-detail" type="text" placeholder="e.g. 90km · 3 hrs easy">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModal()">Save session</button>
    </div>
  </div>
</div>

<script type="module">
// ════════════════════════════════════════════════════════════
//  FIREBASE SETUP
// ════════════════════════════════════════════════════════════
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, remove, onValue, off }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey:            "AIzaSyCgKB-XMUrc1mDXkNFuxVcpV2TMxsoqMpM",
  authDomain:        "training-planner-fd99b.firebaseapp.com",
  databaseURL:       "https://training-planner-fd99b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "training-planner-fd99b",
  storageBucket:     "training-planner-fd99b.firebasestorage.app",
  messagingSenderId: "130760510285",
  appId:             "1:130760510285:web:52fe0d917e9ac94664c504"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const DAYS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DEFAULT_LABELS = { build:'BUILD', key:'PEAK', down:'RECOVERY' };

let fileIndex = [], currentId = null, plan = [], badgeLabels = { ...DEFAULT_LABELS };
let openMenuWi = null, dragging = null, dragOffsetX = 0, dragOffsetY = 0;
let modalState = null, modalType = 'bike', liveListener = null;
const localClientId = 'c' + Date.now() + Math.random().toString(36).slice(2,6);

// ── Sidebar ───────────────────────────────────────────────────
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  window.innerWidth <= 640
    ? (sb.classList.contains('mobile-open') ? closeMobileSidebar() : openMobileSidebar())
    : sb.classList.toggle('collapsed');
}
function openMobileSidebar()  { document.getElementById('sidebar').classList.add('mobile-open'); document.getElementById('sidebar-dimmer').classList.add('show'); }
function closeMobileSidebar() { document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('sidebar-dimmer').classList.remove('show'); }
window.toggleSidebar = toggleSidebar; window.openMobileSidebar = openMobileSidebar; window.closeMobileSidebar = closeMobileSidebar;

// ── Firebase helpers ──────────────────────────────────────────
// Plan IDs are 48-char cryptographic random tokens — unguessable
function genId() {
  const arr = new Uint8Array(24);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2,'0')).join('');
}
// Plans stored at /files/{id} — only readable if you know the exact path
async function fbSaveFile(id, d)  { await set(ref(db, `files/${id}`), d); }
async function fbLoadFile(id)     { const s = await get(ref(db, `files/${id}`)); return s.exists() ? s.val() : null; }
async function fbDeleteFile(id)   { await remove(ref(db, `files/${id}`)); }

// Index (list of your plan IDs) lives in localStorage — never touches Firebase
const LS_INDEX = 'tp_files_index';
function lsSaveIndex() { localStorage.setItem(LS_INDEX, JSON.stringify(fileIndex)); }
function lsLoadIndex() { try { return JSON.parse(localStorage.getItem(LS_INDEX)) || []; } catch(e) { return []; } }

function attachLiveListener(id) {
  if (liveListener) { off(ref(db, `files/${currentId}`)); liveListener = null; }
  liveListener = onValue(ref(db, `files/${id}`), snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    if (data._lastSavedBy === localClientId) return;
    plan        = data.plan        || blankPlan();
    badgeLabels = { ...DEFAULT_LABELS, ...(data.badgeLabels || {}) };
    document.getElementById('plan-title').value   = data.planTitle   || '';
    document.getElementById('plan-athlete').value = data.planAthlete || '';
    render(); showToast('Plan updated');
  });
}

// ── Save / load ───────────────────────────────────────────────
async function saveCurrentFile() {
  if (!currentId) return;
  const title = document.getElementById('plan-title').value;
  const athlete = document.getElementById('plan-athlete').value;
  await fbSaveFile(currentId, { plan, badgeLabels, planTitle:title, planAthlete:athlete, _lastSavedBy:localClientId, _savedAt:Date.now() });
  const meta = fileIndex.find(f=>f.id===currentId);
  if (meta) { meta.name = title||'Untitled plan'; meta.athlete = athlete; meta.updatedAt = Date.now(); }
  lsSaveIndex();
  renderSidebar(); flashSaved();
}
let saveTimer=null, flashTimer=null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveCurrentFile, 800); }
function flashSaved() {
  const el=document.getElementById('save-indicator');
  el.classList.add('visible'); clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>el.classList.remove('visible'),1800);
}

// ── File operations ───────────────────────────────────────────
async function newFile() {
  if (currentId) await saveCurrentFile();
  const id = genId();
  fileIndex.unshift({ id, name:'Untitled plan', athlete:'', updatedAt:Date.now() });
  lsSaveIndex();
  plan=blankPlan(); badgeLabels={...DEFAULT_LABELS}; currentId=id;
  document.getElementById('plan-title').value=''; document.getElementById('plan-athlete').value='';
  attachLiveListener(id); closeMobileSidebar(); renderSidebar(); render();
  setTimeout(()=>document.getElementById('plan-title').focus(),100);
  showToast('New plan created');
}
async function openFile(id) {
  if (id===currentId) { closeMobileSidebar(); return; }
  if (currentId) await saveCurrentFile();
  showToast('Loading…');
  const data = await fbLoadFile(id);
  if (!data) { showToast('Could not load plan'); return; }
  currentId=id; plan=data.plan||blankPlan(); badgeLabels={...DEFAULT_LABELS,...(data.badgeLabels||{})};
  document.getElementById('plan-title').value=data.planTitle||''; document.getElementById('plan-athlete').value=data.planAthlete||'';
  attachLiveListener(id); closeMobileSidebar(); renderSidebar(); render();
}
async function deleteFile(id,e) {
  e&&e.stopPropagation();
  const meta=fileIndex.find(f=>f.id===id);
  if(!confirm(`Delete "${meta?.name||'this plan'}"? Cannot be undone.`))return;
  await fbDeleteFile(id);
  fileIndex=fileIndex.filter(f=>f.id!==id);
  lsSaveIndex();
  if(currentId===id){ if(liveListener){off(ref(db,`files/${id}`));liveListener=null;} currentId=null;plan=[];document.getElementById('plan-title').value='';document.getElementById('plan-athlete').value='';render(); }
  renderSidebar(); showToast('Plan deleted');
}
function startRenameFile(id,e) {
  e&&e.stopPropagation();
  const nameEl=document.getElementById(`fname-${id}`);if(!nameEl)return;
  const current=fileIndex.find(f=>f.id===id)?.name||'';
  const inp=document.createElement('input'); inp.className='file-rename-input'; inp.value=current;
  nameEl.replaceWith(inp); inp.focus(); inp.select();
  const commit=async()=>{ const val=inp.value.trim()||'Untitled plan'; const meta=fileIndex.find(f=>f.id===id); if(meta)meta.name=val; lsSaveIndex(); if(id===currentId){document.getElementById('plan-title').value=val;await saveCurrentFile();} renderSidebar(); };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){inp.value=current;inp.blur();} });
}
async function duplicateFile(id,e) {
  e&&e.stopPropagation();
  const data=await fbLoadFile(id); if(!data)return;
  const meta=fileIndex.find(f=>f.id===id);
  const newId=genId(); const newName=(meta?.name||'Plan')+' (copy)';
  await fbSaveFile(newId,{...data,planTitle:newName,_lastSavedBy:localClientId,_savedAt:Date.now()});
  fileIndex.splice(fileIndex.findIndex(f=>f.id===id)+1,0,{id:newId,name:newName,athlete:meta?.athlete||'',updatedAt:Date.now()});
  lsSaveIndex(); renderSidebar(); showToast('Plan duplicated');
}
window.newFile=newFile; window.openFile=openFile; window.deleteFile=deleteFile;
window.startRenameFile=startRenameFile; window.duplicateFile=duplicateFile;

// ── Sidebar render ────────────────────────────────────────────
function timeAgo(ts) {
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'just now'; if(s<3600)return`${Math.floor(s/60)}m ago`;
  if(s<86400)return`${Math.floor(s/3600)}h ago`; return`${Math.floor(s/86400)}d ago`;
}
function renderSidebar() {
  const el=document.getElementById('sidebar-files');
  if(!fileIndex||fileIndex.length===0){el.innerHTML=`<div style="padding:16px 12px;font-size:11px;color:var(--sidebar-text-2);text-align:center;line-height:1.6">No plans yet.<br>Click + New plan to start.</div>`;return;}
  el.innerHTML=fileIndex.map(f=>{
    const isActive=f.id===currentId;
    const meta=f.athlete?`${f.athlete} · ${timeAgo(f.updatedAt)}`:timeAgo(f.updatedAt);
    return`<div class="file-item${isActive?' active':''}" onclick="openFile('${f.id}')" id="fitem-${f.id}">
      <div class="file-item-icon"><svg width="13" height="14" viewBox="0 0 13 14" fill="none"><rect x="1" y="1" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 4.5h6M3.5 7h6M3.5 9.5h4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></div>
      <div class="file-item-body"><div class="file-item-name" id="fname-${f.id}">${esc(f.name)}</div><div class="file-item-meta">${esc(meta)}</div></div>
      <div class="file-actions">
        <button class="file-action-btn" onclick="startRenameFile('${f.id}',event)" title="Rename">✎</button>
        <button class="file-action-btn" onclick="duplicateFile('${f.id}',event)" title="Duplicate">⧉</button>
        <button class="file-action-btn del" onclick="deleteFile('${f.id}',event)" title="Delete">✕</button>
      </div></div>`;
  }).join('');
}

// ── Totals ────────────────────────────────────────────────────
function extractKm(d){const m=(d||'').match(/([\d.]+)\s*km/i);return m?parseFloat(m[1]):0;}
function calcTotals(wi){
  let swim=0,bike=0,run=0,sc=0,bc=0,rc=0,gc=0,total=0,done=0;
  DAYS.forEach(day=>(plan[wi].sessions[day]||[]).forEach(s=>{
    const k=extractKm(s.detail);
    if(s.type==='swim'){swim+=k;sc++;} if(s.type==='bike'){bike+=k;bc++;}
    if(s.type==='run'){run+=k;rc++;} if(s.type==='gym'){gc++;}
    total++; if(s.completed)done++;
  }));
  const f=(v,c,u)=>v>0?`~${Math.round(v)}${u}`:c>0?`${c} sess.`:'—';
  return{swim:f(swim,sc,'km'),bike:f(bike,bc,'km'),run:f(run,rc,'km'),gym:gc>0?`${gc} sess.`:'—',total,done};
}

// ── Render ────────────────────────────────────────────────────
function render() {
  const app=document.getElementById('app'); app.innerHTML='';
  if(!currentId||plan.length===0){app.innerHTML=`<div class="empty-state"><div class="empty-state-icon">📋</div><h2>No plan open</h2><p>Select a plan from the sidebar, or create a new one to get started.</p></div>`;return;}
  plan.forEach((week,wi)=>{
    const block=document.createElement('div'); block.className='week-block';
    const tot=calcTotals(wi);
    const bc=week.badge==='key'?'b-key':week.badge==='build'?'b-build':'b-down';
    const bl=badgeLabels[week.badge]||week.badge.toUpperCase();
    block.innerHTML=`
      <div class="week-header">
        <div class="week-header-left">
          <div class="week-num">WEEK ${week.week}</div>
          <input class="week-edit-title" data-wi="${wi}" type="text" value="${esc(week.title)}" placeholder="Week title…">
          <input class="week-edit-desc"  data-wi="${wi}" type="text" value="${esc(week.desc)}"  placeholder="Short description…">
        </div>
        <div class="week-header-right">
          <button class="badge-btn ${bc}" id="bbtn-${wi}" onclick="toggleMenu(${wi})">${esc(bl)}</button>
          <button class="week-ctrl-btn remove" onclick="removeWeek(${wi})" style="padding:4px 8px;font-size:11px;border-radius:5px;" title="Remove week">✕</button>
          <div class="badge-menu" id="bmenu-${wi}">
            <div class="badge-menu-section">
              <div class="badge-menu-heading">SET PHASE TYPE</div>
              ${['build','key','down'].map(type=>{
                const label=badgeLabels[type]||type.toUpperCase();
                const sw=type==='build'?'background:#FEF3E0;border:1px solid #6B3C06':type==='key'?'background:#FAEAE3;border:1px solid #7A2D12':'background:#E1EFE8;border:1px solid #1B5E3A';
                return`<div class="badge-menu-item${week.badge===type?' active-badge':''}" onclick="setBadge(${wi},'${type}')"><span class="badge-swatch" style="${sw}"></span><span class="bml-${type}">${esc(label)}</span><span class="badge-checkmark">✓</span></div>`;
              }).join('')}
            </div>
            <hr class="badge-menu-sep">
            <div class="rename-section">
              <div class="badge-menu-heading">RENAME LABELS</div>
              ${['build','key','down'].map(type=>{
                const sw=type==='build'?'background:#FEF3E0;border:1px solid #a0640a':type==='key'?'background:#FAEAE3;border:1px solid #9B3A2A':'background:#E1EFE8;border:1px solid #1B5E3A';
                return`<div class="rename-row"><span class="rename-swatch" style="${sw}"></span><input class="rename-input" type="text" data-type="${type}" value="${esc(badgeLabels[type]||'')}" placeholder="${DEFAULT_LABELS[type]}" oninput="renameLabel('${type}',this.value)"></div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="week-grid" id="grid-${wi}"></div>
      <div class="week-totals">
        <div class="wtot">Swim <strong>${tot.swim}</strong></div>
        <div class="wtot">Bike <strong>${tot.bike}</strong></div>
        <div class="wtot">Run  <strong>${tot.run}</strong></div>
        ${tot.gym!=='—'?`<div class="wtot">Gym <strong>${tot.gym}</strong></div>`:''}
        ${tot.total>0?`<div class="wtot" style="margin-left:auto;display:flex;align-items:center;gap:7px;"><span style="color:${tot.done===tot.total?'#2DB87E':'var(--text-3)'}">${tot.done}/${tot.total} done</span><span style="display:inline-flex;width:60px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;"><span style="width:${tot.total?Math.round(tot.done/tot.total*100):0}%;background:#2DB87E;border-radius:3px;transition:width 0.3s;"></span></span></div>`:''}
      </div>`;
    if(wi<plan.length-1)block.insertAdjacentHTML('beforeend','<hr class="divider" style="margin-top:20px">');
    app.appendChild(block);
    block.querySelector('.week-edit-title').addEventListener('input',function(){plan[+this.dataset.wi].title=this.value;scheduleSave();});
    block.querySelector('.week-edit-desc').addEventListener('input',function(){plan[+this.dataset.wi].desc=this.value;scheduleSave();});
    if(openMenuWi===wi)document.getElementById(`bmenu-${wi}`)?.classList.add('open');
    const grid=document.getElementById(`grid-${wi}`);
    DAYS.forEach(day=>{
      const col=document.createElement('div'); col.className='day-col';
      col.innerHTML=`<div class="day-header">${day}</div>`;
      const zone=document.createElement('div'); zone.className='drop-zone'; zone.dataset.week=wi; zone.dataset.day=day;
      (week.sessions[day]||[]).forEach((s,si)=>zone.appendChild(makeSessionEl(s,wi,day,si)));
      const addBtn=document.createElement('button'); addBtn.className='add-session-btn';
      addBtn.innerHTML=`<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Add`;
      addBtn.addEventListener('click',e=>{e.stopPropagation();openModal('add',wi,day);});
      zone.appendChild(addBtn);
      zone.addEventListener('dragover',onDragOver); zone.addEventListener('dragleave',onDragLeave); zone.addEventListener('drop',onDrop);
      col.appendChild(zone); grid.appendChild(col);
    });
  });
  const ctrl=document.createElement('div'); ctrl.className='week-controls';
  ctrl.innerHTML=`<button class="week-ctrl-btn" onclick="addWeek()"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Add week</button><span class="week-count-label">${plan.length} week${plan.length!==1?'s':''}</span>`;
  app.appendChild(ctrl);
}

// ── Badge menu ────────────────────────────────────────────────
function toggleMenu(wi){const menu=document.getElementById(`bmenu-${wi}`);const isOpen=menu?.classList.contains('open');closeAllMenus();if(!isOpen){menu?.classList.add('open');openMenuWi=wi;}}
function closeAllMenus(){document.querySelectorAll('.badge-menu.open').forEach(m=>m.classList.remove('open'));openMenuWi=null;}
function setBadge(wi,type){plan[wi].badge=type;closeAllMenus();scheduleSave();render();}
function renameLabel(type,value){
  badgeLabels[type]=value||DEFAULT_LABELS[type];
  document.querySelectorAll('.badge-btn').forEach((btn,i)=>{if(plan[i]&&plan[i].badge===type)btn.textContent=value||DEFAULT_LABELS[type];});
  document.querySelectorAll(`.bml-${type}`).forEach(el=>el.textContent=value||DEFAULT_LABELS[type]);
  document.querySelectorAll(`.rename-input[data-type="${type}"]`).forEach(inp=>{if(inp!==document.activeElement)inp.value=value;});
  scheduleSave();
}
document.addEventListener('click',e=>{if(!e.target.closest('.badge-btn')&&!e.target.closest('.badge-menu'))closeAllMenus();});
window.toggleMenu=toggleMenu; window.setBadge=setBadge; window.renameLabel=renameLabel;

// ── Session element ───────────────────────────────────────────
function makeSessionEl(session,wi,day,si){
  const el=document.createElement('div');
  const done=session.completed||false;
  el.className=`session s-${session.type}${done?' completed':''}`;
  el.draggable=true; el.dataset.week=wi; el.dataset.day=day; el.dataset.si=si;
  el.innerHTML=`<div class="s-name"><span class="s-dot"></span>${esc(session.name)}<span class="s-tick" title="${done?'Mark incomplete':'Mark complete'}">✓</span></div><div class="s-detail">${esc(session.detail)}</div><div class="session-actions"><button class="s-action edit">Edit</button><button class="s-action del">Delete</button></div>`;
  el.querySelector('.s-tick').addEventListener('click',e=>{e.stopPropagation();plan[wi].sessions[day][si].completed=!plan[wi].sessions[day][si].completed;scheduleSave();render();});
  el.querySelector('.edit').addEventListener('click',e=>{e.stopPropagation();openModal('edit',wi,day,si);});
  el.querySelector('.del').addEventListener('click',e=>{e.stopPropagation();const name=plan[wi].sessions[day][si].name;plan[wi].sessions[day].splice(si,1);showToast(`Deleted "${name}"`);scheduleSave();render();});
  el.addEventListener('dragstart',e=>{if(e.target.classList.contains('s-action')||e.target.classList.contains('s-tick')){e.preventDefault();return;}dragging={weekIdx:wi,day,sessionIdx:si};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragging=null;document.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));});
  el.addEventListener('touchstart',onTouchStart,{passive:false});
  return el;
}

// ── Drag & drop ───────────────────────────────────────────────
function onDragOver(e){if(!dragging)return;e.preventDefault();e.dataTransfer.dropEffect='move';this.classList.add('drag-over');}
function onDragLeave(){this.classList.remove('drag-over');}
function onDrop(e){e.preventDefault();this.classList.remove('drag-over');if(!dragging)return;const tw=parseInt(this.dataset.week),td=this.dataset.day;const{weekIdx:fw,day:fd,sessionIdx:fsi}=dragging;if(fw===tw&&fd===td)return;const s=plan[fw].sessions[fd].splice(fsi,1)[0];plan[tw].sessions[td].push(s);showToast(`Moved "${s.name}" → Week ${tw+1} ${td}`);scheduleSave();render();}
let touchGhost=null,touchDragging=null;
function onTouchStart(e){if(e.target.classList.contains('s-action')||e.target.classList.contains('s-tick'))return;if(e.touches.length>1)return;e.preventDefault();const el=e.currentTarget;const wi=+el.dataset.week,day=el.dataset.day,si=+el.dataset.si;const rect=el.getBoundingClientRect(),t=e.touches[0];dragOffsetX=t.clientX-rect.left;dragOffsetY=t.clientY-rect.top;touchDragging={weekIdx:wi,day,sessionIdx:si,session:plan[wi].sessions[day][si]};touchGhost=el.cloneNode(true);touchGhost.classList.add('floating');touchGhost.style.width=rect.width+'px';touchGhost.style.left=(t.clientX-dragOffsetX)+'px';touchGhost.style.top=(t.clientY-dragOffsetY)+'px';document.body.appendChild(touchGhost);el.style.opacity='0.3';document.addEventListener('touchmove',onTouchMove,{passive:false});document.addEventListener('touchend',onTouchEnd);}
function onTouchMove(e){e.preventDefault();const t=e.touches[0];touchGhost.style.left=(t.clientX-dragOffsetX)+'px';touchGhost.style.top=(t.clientY-dragOffsetY)+'px';document.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));touchGhost.style.display='none';const under=document.elementFromPoint(t.clientX,t.clientY);touchGhost.style.display='';const zone=under?under.closest('.drop-zone'):null;if(zone)zone.classList.add('drag-over');}
function onTouchEnd(e){document.removeEventListener('touchmove',onTouchMove);document.removeEventListener('touchend',onTouchEnd);document.querySelectorAll('.drag-over').forEach(z=>z.classList.remove('drag-over'));const t=e.changedTouches[0];touchGhost.style.display='none';const under=document.elementFromPoint(t.clientX,t.clientY);touchGhost.style.display='';if(touchGhost){touchGhost.remove();touchGhost=null;}const zone=under?under.closest('.drop-zone'):null;if(zone&&touchDragging){const tw=+zone.dataset.week,td=zone.dataset.day;const{weekIdx:fw,day:fd,sessionIdx:fsi,session}=touchDragging;if(!(fw===tw&&fd===td)){plan[fw].sessions[fd].splice(fsi,1);plan[tw].sessions[td].push(session);showToast(`Moved "${session.name}" → Week ${tw+1} ${td}`);}}touchDragging=null;scheduleSave();render();}

// ── Week controls ─────────────────────────────────────────────
function addWeek(){const n=plan.length+1;plan.push({week:n,title:`Week ${n}`,desc:'',badge:'build',sessions:{MON:[],TUE:[],WED:[],THU:[],FRI:[],SAT:[],SUN:[]}});scheduleSave();render();setTimeout(()=>{const bs=document.querySelectorAll('.week-block');if(bs.length)bs[bs.length-1].scrollIntoView({behavior:'smooth',block:'start'});},50);showToast(`Week ${n} added`);}
function removeWeek(wi){if(plan.length<=1){showToast('Must have at least one week');return;}const hasContent=DAYS.some(d=>(plan[wi].sessions[d]||[]).length>0);if(hasContent&&!confirm(`Remove Week ${wi+1}? All sessions in this week will be lost.`))return;plan.splice(wi,1);plan.forEach((w,i)=>{w.week=i+1;});scheduleSave();render();showToast('Week removed');}
window.addWeek=addWeek; window.removeWeek=removeWeek;

// ── Modal ─────────────────────────────────────────────────────
function openModal(mode,wi,day,si){modalState={mode,weekIdx:wi,day,sessionIdx:si};document.getElementById('modal-context').textContent=`${plan[wi].title||'Week '+(wi+1)} · ${day}`;document.getElementById('modal-heading').textContent=mode==='edit'?'Edit session':'Add session';if(mode==='edit'){const s=plan[wi].sessions[day][si];document.getElementById('modal-name').value=s.name;document.getElementById('modal-detail').value=s.detail;selectType(s.type);}else{document.getElementById('modal-name').value='';document.getElementById('modal-detail').value='';selectType('bike');}document.getElementById('modal-overlay').classList.add('open');setTimeout(()=>document.getElementById('modal-name').focus(),200);}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');modalState=null;}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
function selectType(type){modalType=type;document.querySelectorAll('.type-pill').forEach(p=>p.classList.toggle('active',p.dataset.type===type));}
function saveModal(){if(!modalState)return;const name=document.getElementById('modal-name').value.trim();const detail=document.getElementById('modal-detail').value.trim();if(!name){document.getElementById('modal-name').focus();return;}const{mode,weekIdx:wi,day,sessionIdx:si}=modalState;const s={type:modalType,name,detail};if(mode==='add'){plan[wi].sessions[day].push(s);showToast(`Added "${name}"`);}else{plan[wi].sessions[day][si]=s;showToast(`Updated "${name}"`);}closeModal();scheduleSave();render();}
document.addEventListener('keydown',e=>{const mo=document.getElementById('modal-overlay').classList.contains('open');if(e.key==='Escape'){closeModal();closeAllMenus();}if(e.key==='Enter'&&mo)saveModal();});
window.openModal=openModal; window.closeModal=closeModal; window.overlayClick=overlayClick; window.selectType=selectType; window.saveModal=saveModal;

// ── Plan actions ──────────────────────────────────────────────
document.getElementById('plan-title').addEventListener('input',()=>{if(currentId){const m=fileIndex.find(f=>f.id===currentId);if(m)m.name=document.getElementById('plan-title').value||'Untitled plan';lsSaveIndex();renderSidebar();}scheduleSave();});
document.getElementById('plan-athlete').addEventListener('input',()=>scheduleSave());
async function clearPlan(){if(!currentId)return;if(!confirm('Clear all sessions and reset this plan?'))return;plan=blankPlan();badgeLabels={...DEFAULT_LABELS};document.getElementById('plan-title').value='';document.getElementById('plan-athlete').value='';await saveCurrentFile();render();renderSidebar();showToast('Plan cleared');}
async function resetSessions(){if(!currentId)return;if(!confirm('Clear all sessions? Week names and labels are kept.'))return;plan.forEach(w=>DAYS.forEach(d=>{w.sessions[d]=[];}));scheduleSave();render();showToast('Sessions cleared');}
window.clearPlan=clearPlan; window.resetSessions=resetSessions;

// ── URL sharing ───────────────────────────────────────────────
const LZ=(()=>{function compress(str){const dict={};let data=(str+'').split(''),out=[],phrase=data[0],code=256;for(let i=1;i<data.length;i++){const c=data[i];if(dict[phrase+c]!=null){phrase+=c;}else{out.push(phrase.length>1?dict[phrase]:phrase.charCodeAt(0));dict[phrase+c]=code++;phrase=c;}}out.push(phrase.length>1?dict[phrase]:phrase.charCodeAt(0));return out.map(c=>String.fromCharCode(c+32)).join('');}function decompress(str){const dict={},data=(str+'').split('').map(c=>c.charCodeAt(0)-32);let currChar=String.fromCharCode(data[0]),oldPhrase=currChar,out=[currChar],code=256;for(let i=1;i<data.length;i++){const cc=data[i];let phrase;if(cc<256){phrase=String.fromCharCode(cc);}else{phrase=dict[cc]!=null?dict[cc]:oldPhrase+currChar;}out.push(phrase);currChar=phrase[0];dict[code++]=oldPhrase+currChar;oldPhrase=phrase;}return out.join('');}return{compress,decompress};})();
function encodePlan(data){const json=JSON.stringify(data),compressed=LZ.compress(json),bytes=new TextEncoder().encode(compressed);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function decodePlan(str){const b64=str.replace(/-/g,'+').replace(/_/g,'/'),binary=atob(b64),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)),decoded=new TextDecoder().decode(bytes);try{return JSON.parse(LZ.decompress(decoded));}catch(e){return JSON.parse(decoded);}}
function buildShareUrl(){const title=document.getElementById('plan-title').value,athlete=document.getElementById('plan-athlete').value,typeMap={bike:'b',run:'r',swim:'s',gym:'g'},minPlan=(plan||[]).map(w=>({w:w.week,t:w.title,d:w.desc,b:w.badge,s:Object.fromEntries(DAYS.map(day=>[day.toLowerCase().slice(0,2),(w.sessions[day]||[]).map(s=>({y:typeMap[s.type]||s.type,n:s.name,d:s.detail,c:s.completed||false}))]))})),shareData={v:2,t:title||'',a:athlete||'',l:badgeLabels,p:minPlan};return`https://nickoverton.github.io/training-planner/training_planner.html#plan=${encodePlan(shareData)}`;}
function expandPlan(raw){const typeMap={b:'bike',r:'run',s:'swim',g:'gym'};return{planTitle:raw.t||'',planAthlete:raw.a||'',badgeLabels:{...DEFAULT_LABELS,...(raw.l||{})},plan:(raw.p||[]).map(w=>({week:w.w,title:w.t||'',desc:w.d||'',badge:w.b||'build',sessions:Object.fromEntries(DAYS.map(day=>[day,(w.s[day.toLowerCase().slice(0,2)]||[]).map(s=>({type:typeMap[s.y]||s.y,name:s.n,detail:s.d,completed:s.c||false}))]))}))};}
function shareLink(){if(!currentId){showToast('No plan open');return;}const url=buildShareUrl();document.getElementById('share-plan-name').textContent=document.getElementById('plan-title').value||'Untitled plan';document.getElementById('share-url-input').value=url;const kb=Math.round(url.length/1024*10)/10;const noteEl=document.getElementById('share-note');noteEl.textContent=`Link size: ${kb}KB`;noteEl.style.display='block';document.getElementById('share-overlay').classList.add('open');}
function closeShareModal(e){if(!e||e.target===document.getElementById('share-overlay'))document.getElementById('share-overlay').classList.remove('open');}
async function copyShareUrl(){const url=document.getElementById('share-url-input').value;try{await navigator.clipboard.writeText(url);showToast('Link copied!');}catch(e){document.getElementById('share-url-input').select();showToast('Press Ctrl+C / Cmd+C to copy');}}
window.shareLink=shareLink; window.closeShareModal=closeShareModal; window.copyShareUrl=copyShareUrl;
let incomingData=null;
function checkUrlForPlan(){try{const hash=window.location.hash;if(!hash.startsWith('#plan='))return;const encoded=hash.slice(6);if(!encoded)return;const raw=decodePlan(encoded);let fileData;if(raw.v===2){fileData=expandPlan(raw);}else if(raw._tp===1){fileData={planTitle:raw.t||'',planAthlete:raw.a||'',badgeLabels:{...DEFAULT_LABELS,...(raw.l||{})},plan:raw.p||[]};}else return;if(!Array.isArray(fileData.plan)||fileData.plan.length===0)return;incomingData=fileData;document.getElementById('incoming-title').textContent=`"${fileData.planTitle||'Shared plan'}"${fileData.planAthlete?` for ${fileData.planAthlete}`:''}`;document.getElementById('incoming-sub').textContent='A training plan was shared with you via this link';document.getElementById('incoming-banner').classList.add('show');history.replaceState(null,'',window.location.href.split('#')[0]);}catch(e){console.warn('Could not parse shared plan:',e);}}
async function acceptIncoming(){if(!incomingData)return;const fileData={...incomingData};dismissIncoming();if(currentId)await saveCurrentFile();const id=genId(),name=fileData.planTitle||'Shared plan';await fbSaveFile(id,{...fileData,_lastSavedBy:localClientId,_savedAt:Date.now()});fileIndex.unshift({id,name,athlete:fileData.planAthlete||'',updatedAt:Date.now()});lsSaveIndex();currentId=id;plan=fileData.plan;badgeLabels=fileData.badgeLabels;document.getElementById('plan-title').value=fileData.planTitle;document.getElementById('plan-athlete').value=fileData.planAthlete;attachLiveListener(id);renderSidebar();render();showToast(`Opened "${name}" — saved to your plans`);}
function dismissIncoming(){document.getElementById('incoming-banner').classList.remove('show');incomingData=null;}
window.acceptIncoming=acceptIncoming; window.dismissIncoming=dismissIncoming;

// ── Export / import ───────────────────────────────────────────
function exportPlan(){if(!currentId){showToast('No plan open');return;}const title=document.getElementById('plan-title').value.trim()||'Training Plan',athlete=document.getElementById('plan-athlete').value.trim();let out=title+(athlete?` — ${athlete}`:'')+'\n'+'='.repeat(48)+'\n\n';plan.forEach((week,wi)=>{const tot=calcTotals(wi),bl=badgeLabels[week.badge]||week.badge.toUpperCase();out+=`WEEK ${week.week} [${bl}] — ${week.title||''}\n`;if(week.desc)out+=`${week.desc}\n`;out+=`Totals: Swim ${tot.swim} · Bike ${tot.bike} · Run ${tot.run}${tot.gym!=='—'?' · Gym '+tot.gym:''}\n`;DAYS.forEach(day=>{const ss=week.sessions[day]||[];out+=ss.length?`  ${day}: `+ss.map(s=>`${s.completed?'✓ ':''}${s.name}${s.detail?' ('+s.detail+')':''}`).join(' + ')+'\n':`  ${day}: Rest\n`;});out+='\n';});const blob=new Blob([out],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a'),fn=(title+(athlete?`_${athlete}`:'')).replace(/\s+/g,'_').replace(/[^\w_-]/g,'')||'training_plan';a.href=url;a.download=`${fn}.txt`;a.click();URL.revokeObjectURL(url);showToast('Plan exported');}
function triggerImport(){document.getElementById('import-input').value='';document.getElementById('import-input').click();}
async function handleImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async evt=>{try{const data=JSON.parse(evt.target.result);if(!data._tp_format||!Array.isArray(data.plan)){showToast('Not a valid training plan file');return;}if(currentId)await saveCurrentFile();const id=genId(),name=data.planTitle||file.name.replace(/\.json$/,'')||'Imported plan',fileData={planTitle:data.planTitle||'',planAthlete:data.planAthlete||'',badgeLabels:{...DEFAULT_LABELS,...(data.badgeLabels||{})},plan:data.plan};await fbSaveFile(id,{...fileData,_lastSavedBy:localClientId,_savedAt:Date.now()});fileIndex.unshift({id,name,athlete:data.planAthlete||'',updatedAt:Date.now()});lsSaveIndex();currentId=id;plan=fileData.plan;badgeLabels=fileData.badgeLabels;document.getElementById('plan-title').value=fileData.planTitle;document.getElementById('plan-athlete').value=fileData.planAthlete;attachLiveListener(id);renderSidebar();render();showToast(`Imported "${name}"`);}catch(err){showToast('Could not read file');}};reader.readAsText(file);}
document.addEventListener('dragover',e=>{if([...e.dataTransfer.items].some(i=>i.kind==='file'))e.preventDefault();});
document.addEventListener('drop',e=>{const file=[...e.dataTransfer.files].find(f=>f.name.endsWith('.json'));if(!file)return;e.preventDefault();handleImport({target:{files:[file]}});});
window.exportPlan=exportPlan; window.triggerImport=triggerImport; window.handleImport=handleImport;

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
window.showToast=showToast;

// ── Init ──────────────────────────────────────────────────────
async function init(){
  document.getElementById('app').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⏳</div><h2>Loading…</h2><p>Connecting to cloud</p></div>`;

  // Index always comes from localStorage — only you can see your plan list
  fileIndex = lsLoadIndex();

  if(fileIndex.length>0){
    const latest=[...fileIndex].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    try{
      const data=await fbLoadFile(latest.id);
      if(data){
        currentId=latest.id;
        plan=data.plan||blankPlan();
        badgeLabels={...DEFAULT_LABELS,...(data.badgeLabels||{})};
        document.getElementById('plan-title').value=data.planTitle||'';
        document.getElementById('plan-athlete').value=data.planAthlete||'';
        attachLiveListener(latest.id);
      }
    }catch(e){ showToast('Could not load plan — check your connection'); }
  }

  renderSidebar(); render(); checkUrlForPlan();
}
init();
</script>
